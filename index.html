<style>
  /* Layout: one centered column of square boxes with hard offset shadows (45 degrees, down-right).
     Solid colors only, no gradients. Every color can be changed in edit mode.
     Edit mode adds a separate dark editor (blue is used only for editor tools). */
  :root {
    --bg: #f2f2f2;
    --card: #ffffff;
    --line: #d9d9d9;
    --fg: #111111;
    --muted: #707070;
    --ink: #111111;
    --ink-fg: #ffffff;
    --ph: #e2e2e2;
    --shade: #d4d4d4;
    --sh: 6px;
    --lsz: 96px;
    --wcol: var(--col);
    --bcol: var(--col);
    --col: 560px;
    --gap: 24px;
    --insp-h: 320px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Roboto, Arial, sans-serif;
    --font-head: var(--font);
    --zs: 1;
    --zd: 1.25;
    --z: var(--zs);
    --ui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    --ui-accent: #3b82f6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0e0e;
      --card: #181818;
      --line: #2e2e2e;
      --fg: #f2f2f2;
      --muted: #8f8f8f;
      --ink: #f2f2f2;
      --ink-fg: #0e0e0e;
      --ph: #1f1f1f;
      --shade: #1b1b1b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0e0e;
    --card: #181818;
    --line: #2e2e2e;
    --fg: #f2f2f2;
    --muted: #8f8f8f;
    --ink: #f2f2f2;
    --ink-fg: #0e0e0e;
    --ph: #1f1f1f;
    --shade: #1b1b1b;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 var(--font);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  img { max-width: 100%; }
  #app { transition: opacity .2s ease; zoom: var(--z); }
  @media (min-width: 760px) { :root { --z: var(--zd); } }
  #app.loading { opacity: 0; }

  /* ---------- The page ---------- */
  .col {
    max-width: max(var(--col), var(--wcol), var(--bcol));
    margin-inline: auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px 56px;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    min-width: 0;
  }

  .col > * { width: 100%; max-width: var(--col); align-self: center; }
  .col > .blk.fit { width: auto; }
  .col > .banner, .col > .t-banner { max-width: var(--bcol); }
  .col > .work { max-width: var(--wcol); }

  .banner, .logo, .btn, .meme {
    border-radius: 0;
    box-shadow: var(--sh) var(--sh) 0 var(--shade);
  }

  .banner { position: relative; background: var(--ph); overflow: hidden; }
  .banner:not(.has) { aspect-ratio: 2576 / 1351; }
  .banner img { display: block; width: 100%; height: auto; }

  .logo {
    align-self: center;
    width: var(--lsz); height: var(--lsz);
    background: var(--card);
    border: 4px solid var(--bg);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    font-weight: 700; font-size: 28px; letter-spacing: 1px;
  }
  .logo.over { margin-top: calc(var(--lsz) / -2 - var(--gap)); }
  .logo img { width: 100%; height: 100%; object-fit: contain; display: block; position: absolute; inset: 0; }

  .id { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  h1, .work h2 { font-family: var(--font-head); color: var(--head, var(--fg)); }
  h1 { text-align: center; font-size: 1.6rem; line-height: 1.2; font-weight: 700; margin: 0; letter-spacing: -0.2px; text-wrap: balance; overflow-wrap: anywhere; }
  .bio { text-align: center; color: var(--muted); font-size: 0.95rem; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }

  .links { display: flex; flex-direction: column; gap: 14px; }
  .btn {
    display: block;
    width: 100%;
    min-height: 52px;
    text-align: center;
    padding: 14px 18px;
    background: var(--btnbg, var(--card));
    color: var(--btnfg, var(--fg));
    border: 1px solid var(--line);
    font: inherit;
    font-size: 1rem;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    transition: transform .12s ease;
    -webkit-tap-highlight-color: transparent;
    overflow-wrap: anywhere;
  }
  .btn:hover { transform: translate(-1px, -1px); }
  .btn:active { transform: translate(0, 0); }
  .btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .btn.main { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); font-weight: 600; }

  /* Work with me */
  .work { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .work-head { display: flex; flex-direction: column; gap: 6px; }
  .work h2 { font-size: 1.15rem; text-align: center; font-weight: 700; margin: 0; text-wrap: balance; }
  .work .sub { text-align: center; color: var(--muted); font-size: 0.92rem; margin: 0; text-wrap: balance; }
  .work-note { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 0; }
  .slider { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  .slider:focus-visible { outline: 2px solid var(--fg); outline-offset: 6px; }
  .memes { min-width: 0; }
  .memes > .in { animation: slidein .22s ease; }
  @keyframes slidein { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
  .meme { background: var(--card); border: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; width: 100%; }
  .meme .above { padding: 12px 14px 10px; font-size: 0.88rem; color: var(--muted); overflow-wrap: break-word; }
  .meme .pic { background: var(--ph); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 0.85rem; position: relative; overflow: hidden; }
  .meme .pic:not(.has) { aspect-ratio: 2576 / 1351; }
  .meme .pic img { display: block; width: 100%; height: auto; }
  .meme .cap { padding: 12px 14px; font-size: 0.95rem; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 6px 10px; }
  .meme .below { min-width: 0; overflow-wrap: break-word; flex: 1 1 9ch; }
  .meme .score { font-weight: 700; white-space: nowrap; }
  .empty { padding: 8px; text-align: center; }
  .slidebar { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .arrow {
    width: 54px; height: 54px; flex: none; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--btnbg, var(--card)); color: var(--btnfg, var(--fg));
    border: 1px solid var(--line); border-radius: 0;
    box-shadow: var(--sh) var(--sh) 0 var(--shade);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .arrow:active { transform: translate(2px, 2px); }
  .arrow:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .slidemid { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; min-width: 72px; max-width: 60%; }
  .dot { width: 24px; height: 28px; padding: 0; border: 0; background: transparent; cursor: pointer; position: relative; }
  .dot::before { content: ""; position: absolute; left: 6px; right: 6px; top: 9px; bottom: 9px; background: var(--line); }
  .dot.on::before { background: var(--fg); }
  .count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.95rem; }

  footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding-top: 12px; }
  footer p { margin: 0; padding: 10px 0; display: inline-block; min-width: 120px; user-select: none; -webkit-user-select: none; }

  @media (min-width: 640px) {
    h1 { font-size: 1.85rem; }
  }

  /* ---------- Editor ---------- */

  async function gh(cfg, method, path, body) {
    return fetch('https://api.github.com' + path, {
      method: method,
      headers: {
        'Authorization': 'Bearer ' + cfg.token,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28',
        'Content-Type': 'application/json'
      },
      body: body ? JSON.stringify(body) : undefined
    });
  }
  async function apiError(r) {
    if (r.status === 401) return new Error('GitHub did not accept the token. Make a new one and update the connection.');
    if (r.status === 403) return new Error('GitHub refused this. Check the token has Contents: Read and write.');
    if (r.status === 404) return new Error('Repository not found. Check the username, repository name and token access.');
    var m = '';
    try { m = (await r.json()).message || ''; } catch (e) {}
    return new Error('GitHub error ' + r.status + (m ? ': ' + m : ''));
  }
  function utf8b64(str) {
    var bytes = new TextEncoder().encode(str), bin = '';
    for (var i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    return btoa(bin);
  }
  function b64utf8(b64) {
    var bin = atob(b64.replace(/\s/g, ''));
    return new TextDecoder().decode(Uint8Array.from(bin, function (c) { return c.charCodeAt(0); }));
  }
  async function defaultBranch(cfg) {
    var r = await gh(cfg, 'GET', '/repos/' + cfg.owner + '/' + cfg.repo);
    if (!r.ok) throw await apiError(r);
    return (await r.json()).default_branch || 'main';
  }
  async function putFile(cfg, branch, path, b64, msg, isNew) {
    var base = '/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + encodeURI(path);
    for (var attempt = 0; attempt < 2; attempt++) {
      var sha;
      if (!isNew) {
        var g = await gh(cfg, 'GET', base + '?ref=' + encodeURIComponent(branch));
        if (g.ok) sha = (await g.json()).sha;
        else if (g.status !== 404) throw await apiError(g);
      }
      var body = { message: msg, content: b64, branch: branch };
      if (sha) body.sha = sha;
      var w = await gh(cfg, 'PUT', base, body);
      if (w.ok) return;
      if ((w.status === 409 || w.status === 422) && attempt === 0) { isNew = false; continue; }
      throw await apiError(w);
    }
    throw new Error('GitHub kept refusing the update. Try again in a moment.');
  }
  async function freshFromGitHub(cfg) {
    try {
      var branch = cfg.branch || await defaultBranch(cfg);
      var r = await gh(cfg, 'GET', '/repos/' + cfg.owner + '/' + cfg.repo + '/contents/site.json?ref=' + encodeURIComponent(branch));
      if (!r.ok) return null;
      return JSON.parse(b64utf8((await r.json()).content));
    } catch (e) { return null; }
  }
  function usedPaths() {
    var u = {};
    [S.logo, S.banner, S.fontFile].concat(S.work.items.map(function (x) { return x.image; })).forEach(function (p) { if (p) u[p] = 1; });
    return u;
  }

  async function save() {
    if (busy) return;
    var cfg = getCfg();
    if (!cfg || !cfg.token || !cfg.owner || !cfg.repo) { sheetConnection(save); return; }
    flushHist();
    if (!isDirty()) { toast('Nothing new to save.'); return; }
    busy = true; updateBar();
    try {
      var branch = cfg.branch || await defaultBranch(cfg);
      var used = usedPaths();
      var paths = Object.keys(pending).filter(function (p) { return used[p]; });
      for (var i = 0; i < paths.length; i++) {
        toast('Uploading file ' + (i + 1) + ' of ' + paths.length + '…');
        await putFile(cfg, branch, paths[i], pending[paths[i]].b64, 'Add file', true);
      }
      toast('Saving your changes…');
      await putFile(cfg, branch, 'site.json', utf8b64(JSON.stringify(S, null, 2)), 'Update site content', false);
      saved = JSON.stringify(S);
      pending = {};
      toast('Saved. Your site updates in about a minute.');
    } catch (e) {
      var msg = (e && e.message) || '';
      toast(/Failed to fetch|NetworkError|Load failed/i.test(msg) || e instanceof TypeError
        ? 'Could not reach GitHub. Saving works on your live site with internet.'
        : (msg || 'Could not save.'));
    }
    busy = false; updateBar();
  }

  /* ---------- picking and shrinking pictures ---------- */
  function pickImage(kind, done) {
    if (pickInput && pickInput.parentNode) pickInput.remove();
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;';
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0];
      setTimeout(function () { if (inp.parentNode) inp.remove(); }, 0);
      if (f) readPicture(f, kind, done);
    });
    pickInput = inp;
    document.body.appendChild(inp);
    inp.click();
  }
  function pickFont(done) {
    if (pickInput && pickInput.parentNode) pickInput.remove();
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2';
    inp.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;';
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0];
      setTimeout(function () { if (inp.parentNode) inp.remove(); }, 0);
      if (!f) return;
      var ext = (f.name.split('.').pop() || '').toLowerCase();
      if (['ttf', 'otf', 'woff', 'woff2'].indexOf(ext) < 0) { toast('Use a .ttf, .otf, .woff or .woff2 font file.'); return; }
      if (f.size > 3 * 1024 * 1024) { toast('That font file is over 3 MB. Try a smaller one.'); return; }
      var fr = new FileReader();
      fr.onerror = function () { toast('I could not open that file.'); };
      fr.onload = function () {
        var path = 'fonts/custom-' + Date.now().toString(36) + '.' + ext;
        pending[path] = { b64: String(fr.result).split(',')[1], url: fr.result };
        toast('Font added. Tap Save to publish it.');
        done(path);
      };
      fr.readAsDataURL(f);
    });
    pickInput = inp;
    document.body.appendChild(inp);
    inp.click();
  }
  function readPicture(f, kind, done) {
    toast('Reading picture…');
    var fr = new FileReader();
    fr.onerror = function () { toast('I could not open that file. Try another picture.'); };
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        try {
          var max = kind === 'banner' ? 2600 : (kind === 'logo' ? 800 : 2200);
          var s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
          var w = Math.max(1, Math.round(img.naturalWidth * s)), hh = Math.max(1, Math.round(img.naturalHeight * s));
          var c = document.createElement('canvas');
          c.width = w; c.height = hh;
          var x = c.getContext('2d');
          x.drawImage(img, 0, 0, w, hh);
          var isPng = f.type === 'image/png';
          var pngData = isPng ? c.toDataURL('image/png') : null;
          var jpgData = null;
          if (!(isPng && kind === 'logo')) {
            x.globalCompositeOperation = 'destination-over';
            x.fillStyle = '#ffffff';
            x.fillRect(0, 0, w, hh);
            jpgData = c.toDataURL('image/jpeg', 0.92);
          }
          var data, ext;
          if (isPng && kind === 'logo') { data = pngData; ext = 'png'; }
          else if (isPng && pngData.length <= jpgData.length * 1.25) { data = pngData; ext = 'png'; }
          else { data = jpgData; ext = 'jpg'; }
          var path = 'images/' + kind + '-' + Date.now().toString(36) + '.' + ext;
          pending[path] = { b64: data.split(',')[1], url: data };
          toast('Picture added. Tap Save to publish it.');
          done(path);
        } catch (err) {
          toast('I could not process that picture. Try a JPG or PNG.');
        }
      };
      img.onerror = function () { toast('That picture type can’t be read here. Use a JPG, PNG or WebP.'); };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  }

  /* ---------- editor chrome ---------- */
  function toast(msg) {
    if (!toastEl) { toastEl = h('div', { class: 'toast chrome', role: 'status' }); ui.appendChild(toastEl); }
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.classList.remove('show'); }, 4500);
  }
  function updateBar() {
    if (!saveBtn) return;
    saveBtn.classList.toggle('dirty', isDirty());
    saveBtn.disabled = busy;
    saveBtn.textContent = busy ? 'Saving…' : 'Save';
    if (undoBtn) undoBtn.disabled = !(hist.length > 1 || histT);
    if (redoBtn) redoBtn.disabled = !redoStack.length;
  }
  function ib(name, label, fn) { return h('button', { class: 'ib', type: 'button', 'aria-label': label, title: label, onclick: fn }, icon(name)); }
  function showChrome() {
    if (tbar) return;
    saveBtn = h('button', { class: 'tb primary', type: 'button', text: 'Save', onclick: save });
    pageBtn = ib('sliders', 'Page settings', function () { select(null); });
    undoBtn = ib('undo', 'Undo', undo);
    redoBtn = ib('redo', 'Redo', redo);
    tbar = h('div', { class: 'tbar chrome' },
      ib('close', 'Exit editing', exitEdit),
      undoBtn, redoBtn,
      h('span', { class: 'sp' }),
      ib('eye', 'Preview the page', previewOn),
      ib('palette', 'Colors', openColors),
      pageBtn, saveBtn);
    ui.appendChild(tbar);
    insp = h('aside', { class: 'insp chrome', 'aria-label': 'Editor panel' });
    inspHead = h('div', { class: 'insp-head' });
    inspTabs = h('div', { class: 'tabs', role: 'tablist' });
    inspBody = h('div', { class: 'insp-body' });
    insp.appendChild(inspHead);
    insp.appendChild(inspTabs);
    insp.appendChild(inspBody);
    ui.appendChild(insp);
    if (window.ResizeObserver) {
      ro = new ResizeObserver(function () { root.style.setProperty('--insp-h', insp.offsetHeight + 'px'); });
      ro.observe(insp);
    }
    updateBar();
  }
  function hideChrome() {
    if (ro) { ro.disconnect(); ro = null; }
    if (tbar) { tbar.remove(); tbar = null; }
    if (insp) { insp.remove(); insp = null; }
    if (backBtn) { backBtn.remove(); backBtn = null; }
    saveBtn = null; pageBtn = null; undoBtn = null; redoBtn = null; inspHead = null; inspTabs = null; inspBody = null;
    root.style.removeProperty('--insp-h');
  }

  function openColors() {
    if (!editing) return;
    sel = null;
    tabMemo.page = 2;
    if (insp) insp.classList.remove('min');
    render();
    renderInspector();
  }

  function previewOn() {
    if (!editing || previewing) return;
    flushHist();
    previewing = true;
    editing = false;
    tbar.hidden = true;
    insp.hidden = true;
    backBtn = h('button', { class: 'backpill chrome', type: 'button', onclick: previewOff }, icon('pencil', 18), 'Back to editing');
    ui.appendChild(backBtn);
    render();
    window.scrollTo(0, 0);
  }
  function previewOff() {
    previewing = false;
    editing = true;
    if (backBtn) { backBtn.remove(); backBtn = null; }
    tbar.hidden = false;
    insp.hidden = false;
    render();
    renderInspector();
  }

  function enterEdit() {
    if (editing || previewing) return;
    editing = true;
    sel = null;
    histInit();
    showChrome();
    render();
    renderInspector();
    var cfg = getCfg();
    if (cfg && cfg.token && cfg.owner && cfg.repo) {
      freshFromGitHub(cfg).then(function (d) {
        if (d && editing && !isDirty()) { S = merge(DEFAULT, d); saved = JSON.stringify(S); histInit(); render(); renderInspector(); updateBar(); }
      });
    }
  }
  function leave() {
    editing = false;
    previewing = false;
    sel = null;
    hideChrome();
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    render();
  }
  function exitEdit() {
    flushHist();
    if (isDirty()) {
      sheet('Leave without saving?', function (body, close) {
        body.appendChild(h('p', { class: 'note', text: 'Your changes are not live yet. Leaving now discards them.' }));
        body.appendChild(h('div', { class: 'row' },
          sb('Keep editing', close, 'primary'),
          sb('Leave and discard', function () { S = JSON.parse(saved); pending = {}; close(); leave(); })
        ));
      });
      return;
    }
    leave();
  }
  window.addEventListener('beforeunload', function (e) {
    if ((editing || previewing) && isDirty()) { e.preventDefault(); e.returnValue = ''; }
  });
  window.addEventListener('hashchange', function () { if (location.hash === '#edit') enterEdit(); });
  app.addEventListener('click', function (e) {
    if (editing && !e.target.closest('.blk, .addb, .slidebar')) select(null);
  });

  /* ---------- start ---------- */
  function loadPublic() {
    var timeout = new Promise(function (res) { setTimeout(function () { res(null); }, 2500); });
    var req = fetch('site.json?v=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
    return Promise.race([req, timeout]);
  }
  loadPublic().then(function (data) {
    S = merge(DEFAULT, data || {});
    saved = JSON.stringify(S);
    render();
    app.classList.remove('loading');
    if (location.hash === '#edit') enterEdit();
  });
})();
</script>
</body>
</html>
